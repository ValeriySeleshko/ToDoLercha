<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Food Scanner | Plan4U</title>

  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FoodScanner">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <img src="icon.png" alt="Food Scanner" class="brand-icon">
        <div>
          <h1 class="brand-title">Food Scanner</h1>
          <div class="brand-subtitle">Тестер базы Plan4U</div>
        </div>
      </div>
      <div class="db-pill">
        <span class="pulse-dot"></span>
        <span id="dbCount">Загрузка базы...</span>
      </div>
    </header>

    <!-- PWA Install Banner (Triggers native prompt or iPhone instructions) -->
    <div id="pwaInstallBanner" class="pwa-install-banner" style="display: none;">
      <div class="pwa-banner-content">
        <span class="pwa-banner-icon">📲</span>
        <div class="pwa-banner-texts">
          <div class="pwa-banner-title">Установить приложение</div>
          <div class="pwa-banner-sub">Работает офлайн без интернета и ПК</div>
        </div>
      </div>
      <button id="btnPwaInstall" class="btn-pwa-install" type="button">Установить</button>
    </div>

    <!-- Main Scanner Action Card -->
    <section class="scan-card">
      <button id="btnStartScan" class="btn-scan-main" type="button">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
        </svg>
        <span>Сканировать продукт</span>
      </button>

      <div class="photo-scan-row">
        <!-- Native Camera Photo Capture (100% reliable on all HTTP/HTTPS phones) -->
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
        <button id="btnSnapPhoto" class="btn-photo-snap" type="button">
          <span>📸</span> Сфотографировать штрихкод
        </button>
      </div>

      <!-- Manual Barcode Input Fallback -->
      <div class="manual-input-box">
        <input type="text" id="manualBarcode" class="barcode-input" placeholder="Или введите цифры штрихкода..." inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <button id="btnClearManual" class="btn-clear-code" type="button" title="Очистить" style="display: none;">✕</button>
        <button id="btnManualSubmit" class="btn-submit-code" type="button">Найти</button>
      </div>

      <!-- Quick Test Chips -->
      <div class="quick-tests">
        <span class="quick-tests-label">Быстрый тест (образцы):</span>
        <div class="chips-row">
          <button class="test-chip" type="button" data-code="4820146820111">Хумус Yofi! [Plan4U]</button>
          <button class="test-chip" type="button" data-code="4823077608513">Roshen Корівка [Plan4U]</button>
          <button class="test-chip" type="button" data-code="4820001316384">Кетчуп Торчин [Plan4U]</button>
          <button class="test-chip" type="button" data-code="8000500310427">Nutella [Open Food Facts]</button>
        </div>
      </div>
    </section>

    <!-- Result Container (Fills dynamically) -->
    <section id="resultContainer"></section>

    <!-- Scan History Section -->
    <section class="history-section">
      <div class="history-header">
        <span class="history-title">История проверки</span>
        <button id="btnClearHistory" class="btn-clear-history" type="button">Очистить</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

  </div>

  <!-- Camera Live Scanner Modal -->
  <div id="scannerModal" class="scanner-modal">
    <div class="scanner-topbar">
      <button id="btnCloseScanner" class="btn-icon-round" type="button" title="Закрыть">✕</button>
      <div class="scanner-title-text">Сканер штрихкода</div>
      <div style="display: flex; gap: 8px;">
        <button id="btnToggleTorch" class="btn-icon-round" type="button" title="Фонарик">🔦</button>
        <button id="btnSwitchCam" class="btn-icon-round" type="button" title="Сменить камеру">🔄</button>
      </div>
    </div>

    <!-- Scanner Viewport Frame -->
    <div class="scanner-viewport-wrapper">
      <div id="reader"></div>
      <div class="scanner-reticle">
        <div class="scanner-laser"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>
    </div>

    <div class="scanner-hint">
      Поместите штрихкод товара в рамку. Сканирование произойдет мгновенно!
    </div>
  </div>

  <!-- Scripts: 1. Preinstalled Local DB, 2. Standalone Scanner, 3. App Logic -->
  <script src="Plan4U_Food.js"></script>
  <script src="html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
