<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan4U — Виджет рабочего стола Android (Предпросмотр)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      text-align: center;
    }

    .page-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Phone Mockup Frame */
    .phone-mockup {
      width: 100%;
      max-width: 380px;
      height: 680px;
      border-radius: 40px;
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      border: 8px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      padding: 4px 10px 16px 10px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    /* Home Screen Clock */
    .clock-widget {
      text-align: center;
      margin: 10px 0 20px 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .clock-time {
      font-size: 48px;
      font-weight: 300;
      line-height: 1;
      color: #ffffff;
    }

    .clock-date {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 4px;
    }

    /* ==========================================================================
       ANDROID HOME SCREEN WIDGET (4x2 Plan4U Priority Widget)
       ========================================================================== */
    .android-widget-card {
      background: #ffffff;
      border-radius: 20px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .widget-header {
      background: #fff1f6;
      border-bottom: 1px solid #fbcfe8;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .widget-title-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-title-icon {
      font-size: 15px;
    }

    .widget-title-text {
      font-size: 12.5px;
      font-weight: 800;
      color: #580c35;
      letter-spacing: 0.1px;
    }

    .widget-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-counter-pill {
      font-size: 11px;
      font-weight: 800;
      color: #8a2757;
      background: rgba(216, 58, 136, 0.15);
      padding: 2px 7px;
      border-radius: 12px;
    }

    .widget-btn-add {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(216, 58, 136, 0.15);
      color: #d83a88;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }

    .widget-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #ffffff;
      max-height: 220px;
      overflow-y: auto;
    }

    .widget-task-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .widget-task-item:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .widget-task-item.completed {
      opacity: 0.6;
      background: #f8fafc;
    }

    .widget-checkbox-icon {
      font-size: 15px;
      line-height: 1;
      user-select: none;
    }

    .widget-task-title {
      flex: 1;
      font-family: 'PT Serif', serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
      word-break: break-word;
    }

    .widget-task-item.completed .widget-task-title {
      text-decoration: line-through;
      color: #64748b;
    }

    .widget-meta-badges {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .widget-badge-time {
      font-size: 10px;
      font-weight: 800;
      background: #fee2e2;
      color: #b91c1c;
      border: 0.8px solid #fca5a5;
      padding: 2px 6px;
      border-radius: 5px;
      line-height: 1;
      white-space: nowrap;
    }

    .widget-badge-sec {
      font-size: 10px;
      font-weight: 700;
      background: #e2e8f0;
      color: #475569;
      padding: 2px 6px;
      border-radius: 5px;
      line-height: 1;
      white-space: nowrap;
    }

    /* App Icons Row at Bottom */
    .home-dock {
      margin-top: auto;
      display: flex;
      justify-content: space-around;
      padding: 14px 10px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px;
      margin-bottom: 6px;
    }

    .dock-app-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .app-plan4u {
      background: linear-gradient(135deg, #d83a88, #8a2757);
      color: #ffffff;
      font-size: 26px;
    }

    .app-phone { background: #22c55e; color: #fff; }
    .app-messages { background: #3b82f6; color: #fff; }
    .app-camera { background: #64748b; color: #fff; }

    /* Interactive Controls Panel */
    .controls-panel {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-action {
      background: #334155;
      color: #ffffff;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <h1 class="page-title">📱 Plan4U • Виджет рабочего стола Android</h1>
  <p class="page-subtitle">Виджет 4×2 с отображением главных приоритетов дня, времени и разделов</p>

  <!-- Smartphone Mockup -->
  <div class="phone-mockup">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>14:55</span>
      <span>📶 5G 🔋 98%</span>
    </div>

    <!-- Clock -->
    <div class="clock-widget">
      <div class="clock-time" id="mockTime">14:55</div>
      <div class="clock-date">Суббота, 29 августа</div>
    </div>

    <!-- Android Home Screen Widget (Plan4U Priority Widget) -->
    <div class="android-widget-card" id="priorityWidget">
      <div class="widget-header">
        <div class="widget-title-box">
          <span class="widget-title-icon" id="widgetIcon">⚡</span>
          <span class="widget-title-text">Plan4U • Важные дела</span>
        </div>
        <div class="widget-header-right">
          <span class="widget-counter-pill" id="widgetCounter">1/2</span>
          <button class="widget-btn-add" title="Добавить задачу">+</button>
        </div>
      </div>

      <div class="widget-body" id="widgetList">
        <!-- Task Item 1 -->
        <div class="widget-task-item" onclick="toggleTask(this)">
          <span class="widget-checkbox-icon">⭕</span>
          <span class="widget-task-title">Сдать финансовый отчет за август</span>
          <div class="widget-meta-badges">
            <span class="widget-badge-time">⏰ 14:30</span>
            <span class="widget-badge-sec">👤 Личные</span>
          </div>
        </div>

        <!-- Task Item 2 -->
        <div class="widget-task-item completed" onclick="toggleTask(this)">
          <span class="widget-checkbox-icon">✅</span>
          <span class="widget-task-title">Созвон с командой дизайнеров</span>
          <div class="widget-meta-badges">
            <span class="widget-badge-time">⏰ 17:00</span>
            <span class="widget-badge-sec">📋 Планы</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom App Dock -->
    <div class="home-dock">
      <div class="dock-app-icon app-phone">📞</div>
      <div class="dock-app-icon app-messages">💬</div>
      <div class="dock-app-icon app-plan4u" title="Открыть Plan4U">📖</div>
      <div class="dock-app-icon app-camera">📷</div>
    </div>
  </div>

  <!-- Interactive Controls -->
  <div class="controls-panel">
    <button class="btn-action" onclick="toggleAllDone()">🎉 Переключить "Все выполнено"</button>
    <button class="btn-action" onclick="toggleEmptyState()">✨ Показать пустой статус</button>
    <button class="btn-action" onclick="resetState()">🔄 Сбросить</button>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const el = document.getElementById('mockTime');
      if (el) el.textContent = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function toggleTask(el) {
      el.classList.toggle('completed');
      const icon = el.querySelector('.widget-checkbox-icon');
      if (el.classList.contains('completed')) {
        icon.textContent = '✅';
      } else {
        icon.textContent = '⭕';
      }
      updateWidgetStats();
    }

    let prevDoneCount = 1;

    function updateWidgetStats() {
      const items = document.querySelectorAll('.widget-task-item');
      const done = document.querySelectorAll('.widget-task-item.completed').length;
      const counter = document.getElementById('widgetCounter');
      const icon = document.getElementById('widgetIcon');
      if (counter) counter.textContent = `${done}/${items.length}`;
      if (icon) icon.textContent = (done === items.length && items.length > 0) ? '🎉' : '⚡';

      if (items.length > 0 && done === items.length && prevDoneCount < items.length) {
        setTimeout(() => {
          launchConfetti();
          showWidgetToast('Все дела на сегодня закрыты! Отличная работа ✨');
        }, 150);
      }
      prevDoneCount = done;
    }

    function showWidgetToast(msg) {
      let t = document.getElementById('widgetToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'widgetToast';
        t.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(27,29,36,0.95);backdrop-filter:blur(8px);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.3);z-index:999999;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;text-align:center;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(window._wToastTimer);
      window._wToastTimer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(-20px)';
      }, 2500);
    }

    // Spectacular City Day Multi-Volley Pyrotechnic Salute (~10 choreographed bursts of varying power, height, and beauty)
    function launchConfetti() {
      try {
        // Clear any existing active firework timeouts
        if (window._confettiTimeouts && Array.isArray(window._confettiTimeouts)) {
          window._confettiTimeouts.forEach(t => clearTimeout(t));
        }
        window._confettiTimeouts = [];

        let canvas = document.getElementById('confettiCanvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'confettiCanvas';
          canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:999998;';
          document.body.appendChild(canvas);
        }
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let w = window.innerWidth;
        let h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.scale(dpr, dpr);

        const particles = [];
        const flashes = [];
        let isRunning = true;

        // Rich Festive Color Palettes for varied pyrotechnic flowers
        const PALETTES = {
          rubyMagenta: ['#FF007F', '#FF4D80', '#F72585', '#B5179E', '#FFB703', '#FFFFFF'],
          cyanEmerald: ['#00F5D4', '#06D6A0', '#00BBF9', '#48CAE4', '#90E0EF', '#FFFFFF'],
          goldImperial: ['#FFD700', '#FFC300', '#FFAA00', '#FFE600', '#FFF3B0', '#FFFFFF', '#FFB703'],
          sunsetFlame: ['#FF3366', '#FF6B6B', '#FF9E00', '#FFD000', '#FF5400', '#FFFFFF'],
          violetElectric: ['#7209B7', '#8338EC', '#3A0CA3', '#4CC9F0', '#F72585', '#E0AAFF'],
          grandFestival: ['#FF0055', '#00F5D4', '#FFD700', '#8338EC', '#06D6A0', '#FF9E00', '#4CC9F0', '#FFFFFF', '#FF3366']
        };

        // Helper: spawn one firework explosion burst
        function createBurst(cx, cy, count, palette, options = {}) {
          const spread = options.spread || 1;
          const baseSpeed = options.speed || 10;
          const isGoldenWillow = !!options.goldenWillow;

          // Radiant epicenter flash
          flashes.push({
            x: cx,
            y: cy,
            radius: 12,
            maxRadius: 70 * spread,
            alpha: 0.92,
            color: palette[0] || '#FFF'
          });

          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (Math.random() * 0.85 + 0.15) * baseSpeed * spread;
            const typeRoll = Math.random();
            let type = 'rect';
            if (typeRoll < 0.28) type = 'star';
            else if (typeRoll < 0.54) type = 'spark';
            else if (typeRoll < 0.76) type = 'ribbon';

            if (isGoldenWillow && Math.random() < 0.65) {
              type = 'spark';
            }

            particles.push({
              x: cx,
              y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed * 0.86,
              gravity: isGoldenWillow ? 0.13 : (type === 'spark' ? 0.22 : 0.16),
              drag: isGoldenWillow ? 0.980 : (type === 'spark' ? 0.974 : 0.967),
              size: type === 'ribbon' ? (Math.random() * 9 + 8) : (type === 'spark' ? (Math.random() * 3 + 2.5) : (Math.random() * 6.5 + 5)),
              color: palette[Math.floor(Math.random() * palette.length)],
              rotation: Math.random() * Math.PI * 2,
              rotationSpeed: (Math.random() - 0.5) * 0.18,
              flip: Math.random() * Math.PI * 2,
              flipSpeed: Math.random() * 0.16 + 0.08,
              sway: Math.random() * Math.PI * 2,
              swaySpeed: Math.random() * 0.06 + 0.03,
              swayAmount: Math.random() * 0.4 + 0.2,
              type: type,
              opacity: 1,
              decay: isGoldenWillow ? (Math.random() * 0.0032 + 0.0025) : (Math.random() * 0.0045 + 0.0035),
              twinkleOffset: Math.random() * 10
            });
          }
        }

        // 5 to 10 Choreographed Volleys ("Как на день города" - разная высота, мощность и красота)
        const volleys = [
          // 1. Открытие - Средняя высота слева (Ruby Magenta)
          { delay: 0, x: 0.28, y: 0.38, count: 65, palette: PALETTES.rubyMagenta, speed: 9.5 },
          // 2. Высокий выстрел справа (Cyan Emerald)
          { delay: 380, x: 0.74, y: 0.24, count: 75, palette: PALETTES.cyanEmerald, speed: 10.5 },
          // 3. Золотой пион по центру (Imperial Gold)
          { delay: 820, x: 0.50, y: 0.42, count: 60, palette: PALETTES.goldImperial, speed: 8.5 },
          // 4. Высокий фиолетовый салют слева (Electric Violet)
          { delay: 1320, x: 0.18, y: 0.28, count: 70, palette: PALETTES.violetElectric, speed: 10 },
          // 5. Яркий залп на закатном пламени справа вверху (Sunset Flame)
          { delay: 1850, x: 0.82, y: 0.20, count: 75, palette: PALETTES.sunsetFlame, speed: 11 },
          // 6. Парный синхронный залп по флангам (Emerald + Magenta)
          { delay: 2450, x: 0.26, y: 0.32, count: 60, palette: PALETTES.cyanEmerald, speed: 9.5 },
          { delay: 2450, x: 0.74, y: 0.32, count: 60, palette: PALETTES.rubyMagenta, speed: 9.5 },
          // 7. «Золотая Ива» из самого зенита - медленно струящийся золотой дождь
          { delay: 3100, x: 0.50, y: 0.16, count: 90, palette: PALETTES.goldImperial, speed: 11.5, goldenWillow: true },
          // 8. Быстрый дуплет перед кульминацией
          { delay: 3700, x: 0.36, y: 0.26, count: 65, palette: PALETTES.sunsetFlame, speed: 10 },
          { delay: 3700, x: 0.64, y: 0.26, count: 65, palette: PALETTES.violetElectric, speed: 10 },
          // 9. ГРАНД-ФИНАЛ ДНЯ ГОРОДА! Мощный тройной взрыв на всё небо
          { delay: 4250, x: 0.50, y: 0.22, count: 130, palette: PALETTES.grandFestival, speed: 13.5, spread: 1.25 },
          { delay: 4250, x: 0.20, y: 0.34, count: 65, palette: PALETTES.goldImperial, speed: 10 },
          { delay: 4250, x: 0.80, y: 0.34, count: 65, palette: PALETTES.cyanEmerald, speed: 10 }
        ];

        volleys.forEach(v => {
          const timer = setTimeout(() => {
            if (!isRunning) return;
            w = window.innerWidth;
            h = window.innerHeight;
            createBurst(w * v.x, h * v.y, v.count, v.palette, {
              speed: v.speed,
              spread: v.spread || 1,
              goldenWillow: v.goldenWillow
            });
          }, v.delay);
          window._confettiTimeouts.push(timer);
        });

        if (window._confettiAnimId) cancelAnimationFrame(window._confettiAnimId);

        let frame = 0;
        const startTime = Date.now();

        function render() {
          const curW = window.innerWidth;
          const curH = window.innerHeight;
          if (canvas.width !== curW * dpr || canvas.height !== curH * dpr) {
            canvas.width = curW * dpr;
            canvas.height = curH * dpr;
            ctx.scale(dpr, dpr);
          }
          w = curW;
          h = curH;

          ctx.clearRect(0, 0, w, h);
          frame++;

          // Рендер вспышек детонации в эпицентрах
          for (let f = flashes.length - 1; f >= 0; f--) {
            const fl = flashes[f];
            fl.radius += (fl.maxRadius - fl.radius) * 0.28;
            fl.alpha -= 0.085;
            if (fl.alpha <= 0) {
              flashes.splice(f, 1);
              continue;
            }
            ctx.save();
            const grad = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fl.radius);
            grad.addColorStop(0, 'rgba(255,255,255,' + (fl.alpha * 0.85) + ')');
            grad.addColorStop(0.35, fl.color);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(fl.x, fl.y, fl.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          let alive = 0;
          const pLen = particles.length;

          for (let i = 0; i < pLen; i++) {
            const p = particles[i];
            if (p.opacity <= 0 || p.y > h + 50) continue;
            alive++;

            p.x += p.vx + Math.sin(p.sway) * p.swayAmount;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.sway += p.swaySpeed;
            p.rotation += p.rotationSpeed;
            p.flip += p.flipSpeed;
            p.opacity = Math.max(0, p.opacity - p.decay);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.globalAlpha = p.opacity;

            if (p.type === 'star') {
              // Сияющая мерцающая звезда
              const twinkle = 1 + 0.25 * Math.sin(frame * 0.15 + p.twinkleOffset);
              const r1 = p.size * twinkle;
              const r2 = r1 * 0.42;
              ctx.fillStyle = p.color;
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 6;
              ctx.beginPath();
              for (let s = 0; s < 5; s++) {
                const a1 = (s * 4 * Math.PI) / 5 - Math.PI / 2;
                const a2 = a1 + (2 * Math.PI) / 10;
                ctx[s === 0 ? 'moveTo' : 'lineTo'](Math.cos(a1) * r1, Math.sin(a1) * r1);
                ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
              }
              ctx.closePath();
              ctx.fill();
            } else if (p.type === 'spark') {
              // Искрящийся пиротехнический уголёк с ореолом
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 8;
              ctx.fillStyle = '#FFFFFF';
              ctx.beginPath();
              ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(0, 0, p.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.type === 'ribbon') {
              // Праздничная витая лента-серпантин
              ctx.scale(Math.sin(p.flip), 1);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size * 0.6, -p.size * 0.2, p.size * 1.2, p.size * 0.4);
            } else {
              // Порхающее 3D-конфетти
              ctx.scale(1, Math.cos(p.flip));
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65);
            }

            ctx.restore();
          }

          // Пока идут залпы (в пределах 5300мс) ИЛИ пока в воздухе есть частицы
          const elapsed = Date.now() - startTime;
          const volleysPending = elapsed < 5300;

          if (alive > 0 || volleysPending || flashes.length > 0) {
            window._confettiAnimId = requestAnimationFrame(render);
          } else {
            isRunning = false;
            ctx.clearRect(0, 0, w, h);
            if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
          }
        }

        window._confettiAnimId = requestAnimationFrame(render);
      } catch (err) {
        console.warn('Confetti error:', err);
      }
    }

    function toggleAllDone() {
      const items = document.querySelectorAll('.widget-task-item');
      items.forEach(it => {
        it.classList.add('completed');
        it.querySelector('.widget-checkbox-icon').textContent = '✅';
      });
      updateWidgetStats();
    }

    function toggleEmptyState() {
      const list = document.getElementById('widgetList');
      list.innerHTML = `
        <div style="text-align: center; padding: 24px 10px; color: #64748b;">
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">На сегодня нет важных дел ✨</div>
          <div style="font-size: 12px; font-weight: 700; color: #d83a88; cursor: pointer;">+ Добавить в блокнот</div>
        </div>
      `;
      document.getElementById('widgetCounter').textContent = '0/0';
      document.getElementById('widgetIcon').textContent = '⚡';
      prevDoneCount = 0;
    }

    function resetState() {
      location.reload();
    }
  </script>
</body>
